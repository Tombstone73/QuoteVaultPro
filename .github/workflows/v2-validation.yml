name: V2 Validation

on:
  pull_request:
    paths:
      - 'v2/**'
      - 'shared/**'
      - 'server/**'
      - 'scripts/check-journal-monotonic.mjs'
      - 'scripts/check-migration-history-integrity.mjs'
      - 'scripts/migration-history-integrity.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'railway.json'
      - 'vercel.json'
      - 'docs/architecture/v2/V2_MODULE_OWNERSHIP_BOUNDARIES.md'
      - '.github/workflows/v2-validation.yml'
  push:
    paths:
      - 'v2/**'
      - 'shared/**'
      - 'server/**'
      - 'scripts/check-journal-monotonic.mjs'
      - 'scripts/check-migration-history-integrity.mjs'
      - 'scripts/migration-history-integrity.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'railway.json'
      - 'vercel.json'
      - 'docs/architecture/v2/V2_MODULE_OWNERSHIP_BOUNDARIES.md'
      - '.github/workflows/v2-validation.yml'
  workflow_dispatch:
    inputs:
      guarded_qa:
        description: Run separate QA against an ephemeral dedicated CI PostgreSQL database
        type: boolean
        default: false
      production_native:
        description: Run reviewed Production28 proof on the exact DEV commit in disposable PostgreSQL
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --include=optional
      # No secrets, database services, dotenv, or deployment credentials here.
      - run: npm run v2:validate
      - name: Collect canonical gate diagnostics
        id: validation_report
        if: always()
        run: node v2/scripts/ci-validation-summary.mjs
      - name: 'Canonical result: ${{ steps.validation_report.outputs.summary }}'
        if: always()
        run: echo 'The canonical command above remains the validation gate.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-validation-evidence
          path: .cache/v2-validation/*.json
          if-no-files-found: ignore
  production-native:
    needs: deterministic
    if: >-
      needs.deterministic.result == 'success' && github.ref == 'refs/heads/dev' &&
      ((github.event_name == 'push' && github.event.after == github.sha && github.event.deleted == false) ||
      (github.event_name == 'workflow_dispatch' && inputs.production_native == true))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: v2_native_b_ci_test
          POSTGRES_USER: native_ci
          POSTGRES_PASSWORD: ephemeral-native-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U native_ci -d v2_native_b_ci_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://native_ci:ephemeral-native-ci-only@127.0.0.1:5432/v2_native_b_ci_test
      V2_M0_POSTGRES_INTEGRATION: '1'
      V2_L0_LANE_F_NATIVE_APPROVED: '1'
      V2_L0_LANE_F_APPROVED_NAME: v2_native_b_ci_test
      V2_L0_NATIVE_EXPECTED_COMMIT: ${{ github.sha }}
      V2_NATIVE_OWNER_EVENT_AFTER: ${{ github.event.after }}
      V2_NATIVE_OWNER_MANUAL_OPT_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.production_native == true && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --include=optional
      - name: Validate selected Production native proof
        id: production_proof
        run: node v2/scripts/native-owner-entry.mjs --lane production --expected-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: success() && steps.production_proof.outputs.receiptValid == 'true' && steps.production_proof.outputs.coverageAdjudicated == 'true'
        with:
          name: v2-production-native-evidence
          path: .cache/v2-validation/native-owner/production.json
          if-no-files-found: error
  guarded-qa:
    if: github.event_name == 'workflow_dispatch' && inputs.guarded_qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: v2_ci_test
          POSTGRES_USER: v2_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v2_test -d v2_ci_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://v2_test:ephemeral-ci-only@127.0.0.1:5432/v2_ci_test
      V2_M0_POSTGRES_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npm run v2:test:db
      - run: npm run v2:test:qa
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-guarded-qa-evidence
          path: .cache/v2-validation/*.json
          if-no-files-found: ignore
